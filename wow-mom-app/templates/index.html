<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOW Mom</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#007bff">
</head>
<body>
    <main class="container">
        <nav>
            <ul>
                <li><strong>WOW Mom</strong></li>
            </ul>
            <ul>
                <li><a href="#" onclick="showSection('mothers')">Mothers</a></li>
                <li><a href="#" onclick="showSection('leaders')">Leaders</a></li>
                <li><a href="#" onclick="showSection('groups')">Groups</a></li>
                <li><a href="#" onclick="showSection('applications')">Apps</a></li>
            </ul>
        </nav>

        <section id="mothers">
            <h2>Mothers</h2>
            <button onclick="openMotherForm()">Add Mother</button>
            <table id="mothers-table">
                <thead>
                    <tr>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="mothers-list"></tbody>
            </table>
        </section>

        <section id="leaders" style="display:none">
            <h2>Leaders</h2>
            <tbody id="leaders-list"></tbody>
        </section>

        <section id="groups" style="display:none">
            <h2>Groups</h2>
            <tbody id="groups-list"></tbody>
        </section>

        <section id="applications" style="display:none">
            <h2>Applications</h2>
            <tbody id="applications-list"></tbody>
        </section>

        <!-- Dynamic Form Modal -->
        <dialog id="form-modal">
            <article>
                <header>
                    <a href="#close" aria-label="Close" class="close" onclick="closeModal()"></a>
                    <h3 id="modal-title">Edit</h3>
                </header>
                <form id="generic-form" onsubmit="handleFormSubmit(event)">
                    <div id="form-fields"></div>
                    <footer>
                        <button type="submit">Save</button>
                    </footer>
                </form>
            </article>
        </dialog>
    </main>

    <script src="/static/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js');
        }
    </script>
</body>
</html>
